
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">
    <title>404 - الصفحة غير موجودة</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
            background:
                radial-gradient(circle at 50% 30%, #1b2850 0%, transparent 50%),
                linear-gradient(135deg, #080d1b, #101a32);
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            padding: 40px 25px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 28px;
            background: rgba(255,255,255,.045);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 70px rgba(0,0,0,.35);
        }

        .error-icon {
            font-size: 65px;
            margin-bottom: 10px;
        }

        .error-number {
            font-size: clamp(100px, 25vw, 145px);
            font-weight: 900;
            line-height: 1.2;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 10px 50px rgba(56,189,248,.1);
        }

        h1 {
            font-size: 25px;
            margin: 10px 0;
            font-weight: 800;
        }

        .description {
            color: #aab5ce;
            font-size: 14px;
            line-height: 2;
            margin-bottom: 25px;
        }

        .developer {
            padding: 17px;
            margin: 20px 0;
            border-radius: 16px;
            background: rgba(56,189,248,.07);
            border: 1px solid rgba(56,189,248,.2);
        }

        .developer small {
            display: block;
            color: #9caecb;
            margin-bottom: 5px;
        }

        .developer strong {
            color: #38bdf8;
            font-size: 19px;
        }

        .phone {
            direction: ltr;
            display: block;
            margin-top: 7px;
            color: #fff;
            font-size: 17px;
            font-weight: 700;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 22px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            border-radius: 13px;
            text-decoration: none;
            font-weight: 800;
            font-size: 15px;
            transition: .25s;
        }

        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .call {
            color: white;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
        }

        .whatsapp {
            color: white;
            background: linear-gradient(135deg, #128c4a, #25d366);
        }

        .home {
            display: inline-block;
            margin-top: 22px;
            color: #9caecb;
            font-size: 13px;
            text-decoration: none;
        }

        .home:hover {
            color: #38bdf8;
        }

        footer {
            margin-top: 28px;
            color: #64748b;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="error-icon">🚧</div>

        <div class="error-number">404</div>

        <h1>عذراً! الصفحة غير موجودة</h1>

        <p class="description">
            يبدو أن الصفحة التي تبحث عنها غير متاحة،
            أو ربما تم نقلها أو حذفها.
            <br>
            يُرجى الرجوع إلى مطور الموقع لحل المشكلة.
        </p>

        <div class="developer">
            <small>مطور الموقع والمسؤول التقني</small>
            <strong>Mahmoud Abu Al-Fadl</strong>
            <span class="phone">01093650351</span>
        </div>

        <div class="buttons">

            <a class="btn call" href="tel:01093650351">
                📞 اتصال بمطور الموقع
            </a>

            <a class="btn whatsapp"
               href="https://wa.me/201093650351"
               target="_blank"
               rel="noopener noreferrer">
                💬 تواصل عبر واتساب
            </a>

        </div>

        

        <footer>
            © Mahmoud Abu Al-Fadl - All Rights Reserved
        </footer>

    </main>

</body>
</html>
